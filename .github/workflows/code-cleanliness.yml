name: Code Cleanliness Checks

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Check Code Cleanliness with Docker
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/eclipse-cdt/cdt-infra-github@sha256:3d745b7b84e3f9f9492cc1d280ea3b44028a92c7e9748d1ea8771fed211b5dc4
          options: -v ${{ github.workspace }}:/work
          run: |
            set -ex
            # The image only provides Java 17 and 21, but the target platform needs Java 25.
            # Run Maven with a downloaded Java 25 and leave JAVA_HOME alone, the code formatter
            # and the native builds need the Java of the image.
            # Remove this once the image is rebuilt with Java 25.
            mkdir -p /tmp/jdk25
            curl -fsSL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" | tar xzf - -C /tmp/jdk25 --strip-components=1
            export MVN="env JAVA_HOME=/tmp/jdk25 mvn"
            cd /work
            ./releng/scripts/check_code_cleanliness_only.sh
            ./releng/scripts/check_bundle_versions.sh
            ./releng/scripts/check_bundle_versions_report.sh
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: Code Cleanliness Detailed Logs
          path: "*.log"
